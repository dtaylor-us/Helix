spring.application.name=helix-api
spring.datasource.url=${HELIX_DB_URL:jdbc:postgresql://localhost:5432/helix}
spring.datasource.username=${HELIX_DB_USER:helix}
spring.datasource.password=${HELIX_DB_PASSWORD:helix}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=${PORT:8080}
helix.web.allowed-origins=${HELIX_WEB_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Authentication (ADR-021): Google OAuth2/OIDC login, session-cookie auth. Client id/secret come from
# a Google Cloud OAuth consent screen + credentials entry (console.cloud.google.com/apis/credentials)
# -- they are secrets, so only ever supplied via environment variables, never committed.
spring.security.oauth2.client.registration.google.client-id=${HELIX_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${HELIX_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# Where the SPA lives -- used for the post-login/post-logout redirect target and the OAuth2 failure
# redirect (see SecurityConfig). Must exactly match an authorized redirect URI configured on the
# Google OAuth client for {baseUrl}/login/oauth2/code/google.
helix.web.app-url=${HELIX_WEB_APP_URL:http://localhost:5173}
# Secure=false is required for local HTTP dev; production MUST override this to true via
# HELIX_SESSION_COOKIE_SECURE, since a Secure-flagged cookie is refused entirely over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${HELIX_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# AI Provider Configuration (Increment 4)
# Governed by ADR-006 (optional AI), ADR-007 (local-first), ADR-008 (user governance)
helix.ai.provider=${HELIX_AI_PROVIDER:openai}
helix.ai.timeout-seconds=10
helix.ai.retry-max-attempts=3
helix.ai.retry-delay-ms=100
helix.ai.openai.api-key=${OPENAI_API_KEY:}
helix.ai.openai.model=gpt-4o-mini
helix.ai.openai.base-url=https://api.openai.com
helix.ai.openai.temperature=0.7
helix.ai.openai.max-tokens=150
helix.ai.ollama.base-url=http://localhost:11434
helix.ai.ollama.model=llama2
helix.ai.ollama.temperature=0.7

# Enable scheduling for AI health checks
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=helix-ai-
