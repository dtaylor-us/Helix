services:
  postgres:
    image: postgres:16
    container_name: helix-postgres
    environment:
      POSTGRES_DB: helix
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
    ports:
      - "5432:5432"
    volumes:
      - helix-postgres-data:/var/lib/postgresql/data

volumes:
  helix-postgres-data:
