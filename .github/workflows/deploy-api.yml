name: Deploy API

# ADR-022: builds the Spring Boot API's Docker image, pushes it to GitHub Container Registry, and
# updates the running Azure Container App to use it. Triggered by CI (ci.yml) succeeding on main,
# rather than directly on push -- this should never deploy code that hasn't passed tests.
#
# Deliberately not path-filtered to apps/api/** changes only: re-deploying the same image on an
# unrelated (e.g. docs-only) change to main is a no-op in practice (same image digest, GHA layer
# cache makes the rebuild fast) and far simpler/more reliable than trying to diff commits from inside
# a workflow_run event, whose commit-range semantics are easy to get subtly wrong.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write # required for azure/login's OIDC federated credential flow

concurrency:
  group: deploy-api
  cancel-in-progress: false # never cancel a deploy already in flight

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix-api:latest
            ghcr.io/${{ github.repository_owner }}/helix-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository_owner }}/helix-api:${{ github.event.workflow_run.head_sha }}"

      - name: Wait for the new revision to become healthy
        run: |
          # Container Apps scale-to-zero means the new revision may not even activate (and its health
          # probes won't run) until a request arrives -- this pings the API to force that, and
          # confirms the new revision is actually healthy rather than finding out on the next real
          # user request.
          API_URL=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for _ in $(seq 1 10); do
            if curl -fsS "https://${API_URL}/api/v1/health"; then
              echo "Healthy."
              exit 0
            fi
            sleep 6
          done
          echo "API did not report healthy within the retry window." >&2
          exit 1
